<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>อาจารย์ - ระบบรับส่งเอกสาร (e-Mailbox V1)</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }
    body {
      background-color: #FAF8F5;
      color: #3D3730;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    /* Smooth Shimmer Animation */
    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 0.9; }
      100% { opacity: 0.5; }
    }
    .skeleton-pill {
      animation: shimmer 1.6s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#FAF8F5]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    function LecturerDocumentViewApp() {
      const [viewState, setViewState] = useState('data'); // 'data', 'loading', 'empty'
      const [toastMessage, setToastMessage] = useState(null);

      // Mock documents matching Image 3
      const sampleDocuments = [
        {
          id: 'doc-001',
          title: 'file 1',
          receivedDate: '28 ส.ค. 2026 23:59 น.',
          recipient: 'อ.XXX',
          sender: 'อ.YYY'
        },
        {
          id: 'doc-002',
          title: 'ขอเชิญประชุมคณะกรรมการบริหารหลักสูตร วิทยาการคอมพิวเตอร์',
          receivedDate: '1 ก.ย. 2026 01:00 น.',
          recipient: 'อ.XXX',
          sender: 'อ.YYY'
        },
        {
          id: 'doc-003',
          title: "Newton's first law expresses the principle of inertia: the natural behavior of a body is to move in a straight line at constant speed. A body's motion preserves the status quo, but external forces can perturb this.",
          receivedDate: '30 ก.พ. 2077 10:00 น.',
          recipient: 'อ. Ap P. Le',
          sender: 'อ. Issac Newton'
        },
        {
          id: 'doc-004',
          title: 'อาจารย์ครับ',
          receivedDate: '1 ม.ค. 2028 22:00 น.',
          recipient: 'อ. สมชาย ใจดี',
          sender: 'นายสมหญิง ใจงาม'
        }
      ];

      const showActionToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3000);
      };

      const handlePreviewClick = (doc) => {
        showActionToast(`คลิกดูตัวอย่าง: "${doc.title.substring(0, 30)}..." (พร้อมเชื่อม Issue #3)`);
      };

      const handleDownloadClick = (doc) => {
        showActionToast(`คลิกดาวน์โหลด: "${doc.title.substring(0, 30)}..."`);
      };

      const simulateApiFetch = () => {
        setViewState('loading');
        setTimeout(() => {
          setViewState('data');
        }, 1000);
      };

      return (
        <div className="min-h-screen w-full bg-[#FAF8F5] p-6 sm:p-10 lg:p-14 font-['Prompt',sans-serif] text-[#3D3730] relative">
          {/* Action Notification Toast */}
          {toastMessage && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 z-50 bg-[#8C8176] text-white px-6 py-2.5 rounded-xl shadow-lg text-xs sm:text-sm animate-fade-in flex items-center gap-2">
              <span>🔔</span>
              <span>{toastMessage}</span>
            </div>
          )}

          {/* Quick Demo Toolbar */}
          <div className="fixed bottom-3 right-4 z-40 bg-white/95 backdrop-blur border border-[#D5CEC4] rounded-xl px-3 py-2 shadow-md flex flex-wrap items-center gap-2 text-xs">
            <span className="text-[#70675D] font-medium">Quick State Demo:</span>
            <button
              onClick={() => setViewState('data')}
              className={`px-2.5 py-1 rounded-lg transition ${
                viewState === 'data' ? 'bg-[#8C8176] text-white' : 'bg-[#EFECE6] text-[#70675D] hover:bg-[#E2DDD5]'
              }`}
            >
              1. Show Data (Image 3)
            </button>
            <button
              onClick={() => setViewState('loading')}
              className={`px-2.5 py-1 rounded-lg transition ${
                viewState === 'loading' ? 'bg-[#8C8176] text-white' : 'bg-[#EFECE6] text-[#70675D] hover:bg-[#E2DDD5]'
              }`}
            >
              2. Show Loading Skeleton (Image 2)
            </button>
            <button
              onClick={() => setViewState('empty')}
              className={`px-2.5 py-1 rounded-lg transition ${
                viewState === 'empty' ? 'bg-[#8C8176] text-white' : 'bg-[#EFECE6] text-[#70675D] hover:bg-[#E2DDD5]'
              }`}
            >
              3. Show Empty State (Image 1)
            </button>
            <button
              onClick={simulateApiFetch}
              className="bg-[#6BBF72] text-white px-2.5 py-1 rounded-lg hover:bg-[#5AA860] transition"
            >
              Simulate API Fetch
            </button>
          </div>

          <div className="max-w-6xl mx-auto">
            {/* Top Header Section */}
            <div className="mb-6 sm:mb-8">
              <h1 className="text-2xl sm:text-3xl font-normal text-[#4A433B] tracking-tight mb-1">
                อาจารย์ XXXX
              </h1>
              <p className="text-xs sm:text-sm text-[#70675D] font-light">
                คณะ: yyy
              </p>
            </div>

            {/* Central White Table Card Container */}
            <div className="w-full bg-white rounded-2xl shadow-xs border border-[#E8E4DC] p-5 sm:p-8 min-h-[480px] flex flex-col justify-start">
              {/* Table Column Headers */}
              <div className="w-full grid grid-cols-12 pb-3 mb-3 border-b border-[#EFECE6] text-xs sm:text-sm text-[#70675D] font-normal select-none">
                <div className="col-span-12 md:col-span-4 pl-3">ชื่อเรื่อง</div>
                <div className="hidden md:block md:col-span-3 text-left">วันที่ได้รับ</div>
                <div className="hidden md:block md:col-span-2 text-left">ผู้รับ</div>
                <div className="hidden md:block md:col-span-2 text-left">ผู้ส่ง</div>
                <div className="col-span-12 md:col-span-1 text-right pr-2"></div>
              </div>

              {/* State 1: Loading Skeleton (Matching Image 2) */}
              {viewState === 'loading' && (
                <div className="space-y-3 w-full">
                  {[1, 2, 3].map((item) => (
                    <div
                      key={item}
                      className="w-full grid grid-cols-12 items-center p-3 sm:p-4 rounded-xl border border-[#EFECE6] bg-[#FAF8F5]/30"
                    >
                      <div className="col-span-12 md:col-span-4 pr-4">
                        <div className="h-4 sm:h-5 bg-[#D5CEC4] rounded-full w-4/5 skeleton-pill"></div>
                      </div>
                      <div className="hidden md:block md:col-span-3 pr-4">
                        <div className="h-4 sm:h-5 bg-[#D5CEC4] rounded-full w-3/4 skeleton-pill"></div>
                      </div>
                      <div className="hidden md:block md:col-span-2 pr-4">
                        <div className="h-4 sm:h-5 bg-[#D5CEC4] rounded-full w-2/3 skeleton-pill"></div>
                      </div>
                      <div className="hidden md:block md:col-span-2 pr-4">
                        <div className="h-4 sm:h-5 bg-[#D5CEC4] rounded-full w-2/3 skeleton-pill"></div>
                      </div>
                      <div className="hidden md:flex md:col-span-1 justify-end gap-2 pr-2">
                        <div className="w-5 h-5 rounded-full bg-[#D5CEC4]/60 skeleton-pill"></div>
                        <div className="w-5 h-5 rounded-full bg-[#D5CEC4]/60 skeleton-pill"></div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* State 2: Empty State (Matching Image 1) */}
              {viewState === 'empty' && (
                <div className="w-full flex-1 min-h-[320px] flex items-center justify-center text-center">
                  <p className="text-lg sm:text-xl font-light text-[#9E9689] select-none">
                    ไม่มีเอกสารเข้าสู่ระบบของท่าน
                  </p>
                </div>
              )}

              {/* State 3: Populated Table List (Matching Image 3) */}
              {viewState === 'data' && (
                <div className="space-y-2.5 w-full">
                  {sampleDocuments.map((doc) => (
                    <div
                      key={doc.id}
                      className="w-full grid grid-cols-12 items-center p-3 sm:p-4 rounded-xl border border-[#EFECE6] bg-white hover:bg-[#FAF8F5] transition duration-150 group"
                    >
                      {/* Title */}
                      <div className="col-span-12 md:col-span-4 pl-3 pr-4">
                        <span className="text-xs sm:text-sm text-[#3D3730] font-normal leading-relaxed break-words">
                          {doc.title}
                        </span>
                      </div>

                      {/* Received Date */}
                      <div className="col-span-6 md:col-span-3 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0 pl-3 md:pl-0">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">วันที่: </span>
                        {doc.receivedDate}
                      </div>

                      {/* Recipient */}
                      <div className="col-span-6 md:col-span-2 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">ผู้รับ: </span>
                        {doc.recipient}
                      </div>

                      {/* Sender */}
                      <div className="col-span-6 md:col-span-2 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0 pl-3 md:pl-0">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">ผู้ส่ง: </span>
                        {doc.sender}
                      </div>

                      {/* Action Icons */}
                      <div className="col-span-6 md:col-span-1 flex items-center justify-end gap-3 pr-2 mt-2 md:mt-0">
                        <button
                          type="button"
                          onClick={() => handlePreviewClick(doc)}
                          className="text-[#70675D] hover:text-[#3D3730] hover:bg-[#EFECE6] p-1.5 rounded-lg transition cursor-pointer"
                          title="ดูตัวอย่างเอกสาร"
                          aria-label="ดูตัวอย่างเอกสาร"
                        >
                          <svg
                            className="w-4 h-4 sm:w-5 sm:h-5"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            strokeWidth="1.6"
                          >
                            <path
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                            />
                            <path
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                            />
                          </svg>
                        </button>

                        <button
                          type="button"
                          onClick={() => handleDownloadClick(doc)}
                          className="text-[#70675D] hover:text-[#3D3730] hover:bg-[#EFECE6] p-1.5 rounded-lg transition cursor-pointer"
                          title="ดาวน์โหลดเอกสาร"
                          aria-label="ดาวน์โหลดเอกสาร"
                        >
                          <svg
                            className="w-4 h-4 sm:w-5 sm:h-5"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            strokeWidth="1.6"
                          >
                            <path
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"
                            />
                          </svg>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LecturerDocumentViewApp />);
  </script>
</body>
</html>
