<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>อาจารย์ - ระบบรับส่งเอกสาร (e-Mailbox V1)</title>
  <!-- Google Fonts: Prompt -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Prompt:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & Babel CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- PDF.js CDN for Real PDF Rendering in Modal -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    if (window.pdfjsLib) {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
  </script>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Prompt', sans-serif;
    }
    body {
      background-color: #FAF8F5;
      color: #3D3730;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.2s ease-out forwards;
    }
    @keyframes shimmer {
      0% { opacity: 0.5; }
      50% { opacity: 0.9; }
      100% { opacity: 0.5; }
    }
    .skeleton-pill {
      animation: shimmer 1.6s ease-in-out infinite;
    }
  </style>
</head>
<body class="bg-[#FAF8F5]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // Document Preview Modal Component (TD03 - Issue #5 / Image 4)
    function DocumentPreviewModal({ document: doc, isOpen, onClose }) {
      const [zoom, setZoom] = useState(100);
      const [currentPage, setCurrentPage] = useState(1);
      const [totalPages, setTotalPages] = useState(99);

      useEffect(() => {
        if (isOpen && doc) {
          setZoom(100);
          setCurrentPage(1);
          setTotalPages(doc.totalPages || 99);
        }
      }, [isOpen, doc]);

      // Keyboard Esc & Arrow keys
      useEffect(() => {
        if (!isOpen) return;
        const handleKeyDown = (e) => {
          if (e.key === 'Escape') onClose();
          else if (e.key === 'ArrowRight' && currentPage < totalPages) setCurrentPage(p => p + 1);
          else if (e.key === 'ArrowLeft' && currentPage > 1) setCurrentPage(p => p - 1);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [isOpen, currentPage, totalPages, onClose]);

      if (!isOpen || !doc) return null;

      const handleZoomIn = () => setZoom(p => Math.min(p + 25, 200));
      const handleZoomOut = () => setZoom(p => Math.max(p - 25, 50));
      const handlePrev = () => { if (currentPage > 1) setCurrentPage(p => p - 1); };
      const handleNext = () => { if (currentPage < totalPages) setCurrentPage(p => p + 1); };

      const handleDownload = (e) => {
        e.stopPropagation();
        alert(`กำลังดาวน์โหลดเอกสาร: ${doc.title}`);
      };

      return (
        <div
          id="preview-modal-overlay"
          className="fixed inset-0 z-50 flex flex-col justify-between bg-black/80 backdrop-blur-xs font-['Prompt',sans-serif] select-none animate-fade-in cursor-pointer"
          onClick={onClose}
        >
          {/* Top Header Section inside Modal (Clicking dark top bar closes modal) */}
          <div
            className="w-full flex items-start justify-between p-6 sm:p-8 shrink-0 cursor-pointer"
            onClick={(e) => {
              if (e.target === e.currentTarget) onClose();
            }}
          >
            <div
              className="max-w-2xl text-white space-y-1.5 pr-4 cursor-default"
              onClick={(e) => e.stopPropagation()}
            >
              <h2 className="text-base sm:text-lg md:text-xl font-normal leading-snug tracking-tight text-white/95">
                {doc.title}
              </h2>
              <p className="text-xs sm:text-sm text-white/80 font-light">
                ได้รับ {doc.receivedDate}
              </p>
              <p className="text-xs sm:text-sm text-white/80 font-light">
                จาก {doc.sender}
              </p>
            </div>

            <button
              id="btn-modal-close"
              type="button"
              onClick={(e) => {
                e.stopPropagation();
                onClose();
              }}
              className="text-white/80 hover:text-white transition p-2 text-2xl sm:text-3xl leading-none cursor-pointer shrink-0"
              title="ปิด (Esc หรือคลิกพื้นหลัง)"
            >
              ✕
            </button>
          </div>

          {/* Center: A4 Paper Preview Canvas (Clicking dark area outside paper closes modal) */}
          <div
            className="flex-1 flex items-center justify-center p-4 overflow-auto min-h-0 cursor-pointer"
            onClick={onClose}
          >
            <div
              className="w-full max-w-[580px] aspect-[1/1.414] max-h-[75vh] bg-white rounded shadow-2xl border border-white/20 relative flex items-center justify-center overflow-auto transition-transform duration-200 cursor-default"
              style={{ transform: `scale(${zoom / 100})` }}
              onClick={(e) => e.stopPropagation()}
            >
              <div className="flex flex-col items-center justify-center text-center p-6 text-[#70675D]">
                <span className="text-xl sm:text-2xl font-light tracking-wide text-[#70675D]">
                  Preview เอกสาร
                </span>
              </div>
            </div>
          </div>

          {/* Bottom Dark Control Bar */}
          <div
            className="w-full flex items-center justify-between px-6 sm:px-12 py-4 text-xs sm:text-sm text-white/90 shrink-0 select-none cursor-default"
            onClick={(e) => e.stopPropagation()}
          >
            {/* Zoom Controls */}
            <div className="flex items-center gap-2 sm:gap-3">
              <button
                id="btn-modal-zoom-out"
                type="button"
                onClick={handleZoomOut}
                disabled={zoom <= 50}
                className="hover:text-white px-2 py-1 rounded hover:bg-white/10 transition cursor-pointer disabled:opacity-30 disabled:cursor-default"
                title="ย่อ"
              >
                -
              </button>
              <span className="font-light min-w-[45px] text-center">{zoom}%</span>
              <button
                id="btn-modal-zoom-in"
                type="button"
                onClick={handleZoomIn}
                disabled={zoom >= 200}
                className="hover:text-white px-2 py-1 rounded hover:bg-white/10 transition cursor-pointer disabled:opacity-30 disabled:cursor-default"
                title="ขยาย"
              >
                +
              </button>
            </div>

            {/* Page Counter & Navigation */}
            <div className="flex items-center gap-2">
              {totalPages > 1 && (
                <button
                  type="button"
                  onClick={handlePrev}
                  disabled={currentPage <= 1}
                  className="hover:text-white px-1.5 py-0.5 rounded hover:bg-white/10 transition disabled:opacity-30 cursor-pointer"
                  title="หน้าก่อนหน้า"
                >
                  ◀
                </button>
              )}
              <span className="font-light tracking-wide">
                หน้า {currentPage} จาก {totalPages}
              </span>
              {totalPages > 1 && (
                <button
                  type="button"
                  onClick={handleNext}
                  disabled={currentPage >= totalPages}
                  className="hover:text-white px-1.5 py-0.5 rounded hover:bg-white/10 transition disabled:opacity-30 cursor-pointer"
                  title="หน้าถัดไป"
                >
                  ▶
                </button>
              )}
            </div>

            {/* Download Button */}
            <div>
              <button
                id="btn-modal-download"
                type="button"
                onClick={handleDownload}
                className="text-white/80 hover:text-white hover:bg-white/10 p-2 rounded-lg transition cursor-pointer"
                title="ดาวน์โหลดเอกสาร"
              >
                <svg
                  className="w-5 h-5 sm:w-6 sm:h-6"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                  strokeWidth="1.6"
                >
                  <path
                    strokeLinecap="round"
                    strokeLinejoin="round"
                    d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"
                  />
                </svg>
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function LecturerDocumentViewApp() {
      const [viewState, setViewState] = useState('data'); // 'data', 'loading', 'empty'
      const [selectedDoc, setSelectedDoc] = useState(null);
      const [isModalOpen, setIsModalOpen] = useState(false);

      const sampleDocuments = [
        {
          id: 'doc-001',
          title: 'file 1',
          receivedDate: '28 ส.ค. 2026 23:59 น.',
          recipient: 'อ.XXX',
          sender: 'อ.YYY',
          totalPages: 99
        },
        {
          id: 'doc-002',
          title: 'ขอเชิญประชุมคณะกรรมการบริหารหลักสูตร วิทยาการคอมพิวเตอร์',
          receivedDate: '1 ก.ย. 2026 01:00 น.',
          recipient: 'อ.XXX',
          sender: 'อ.YYY',
          totalPages: 12
        },
        {
          id: 'doc-003',
          title: "Newton's first law expresses the principle of inertia: the natural behavior of a body is to move in a straight line at constant speed. A body's motion preserves the status quo, but external forces can perturb this.",
          receivedDate: '30 ก.พ. 2077 10:00 น.',
          recipient: 'อ. Ap P. Le',
          sender: 'อ. Issac Newton',
          totalPages: 5
        },
        {
          id: 'doc-004',
          title: 'อาจารย์ครับ',
          receivedDate: '1 ม.ค. 2028 22:00 น.',
          recipient: 'อ. สมชาย ใจดี',
          sender: 'นายสมหญิง ใจงาม',
          totalPages: 2
        }
      ];

      const handleOpenModal = (doc) => {
        setSelectedDoc(doc);
        setIsModalOpen(true);
      };

      const handleCloseModal = () => {
        setIsModalOpen(false);
        setSelectedDoc(null);
      };

      const handleDirectDownload = (doc) => {
        alert(`ดาวน์โหลดเอกสาร: ${doc.title}`);
      };

      const simulateApiFetch = () => {
        setViewState('loading');
        setTimeout(() => {
          setViewState('data');
        }, 1000);
      };

      return (
        <div className="min-h-screen w-full bg-[#FAF8F5] p-6 sm:p-10 lg:p-14 font-['Prompt',sans-serif] text-[#3D3730] relative">
          {/* Modal Component */}
          <DocumentPreviewModal
            document={selectedDoc}
            isOpen={isModalOpen}
            onClose={handleCloseModal}
          />

          {/* Quick Demo Toolbar */}
          <div className="fixed bottom-3 right-4 z-40 bg-white/95 backdrop-blur border border-[#D5CEC4] rounded-xl px-3 py-2 shadow-md flex flex-wrap items-center gap-2 text-xs">
            <span className="text-[#70675D] font-medium">Quick State Demo:</span>
            <button
              onClick={() => setViewState('data')}
              className={`px-2.5 py-1 rounded-lg transition ${
                viewState === 'data' ? 'bg-[#8C8176] text-white' : 'bg-[#EFECE6] text-[#70675D] hover:bg-[#E2DDD5]'
              }`}
            >
              1. Show Data
            </button>
            <button
              onClick={() => setViewState('loading')}
              className={`px-2.5 py-1 rounded-lg transition ${
                viewState === 'loading' ? 'bg-[#8C8176] text-white' : 'bg-[#EFECE6] text-[#70675D] hover:bg-[#E2DDD5]'
              }`}
            >
              2. Show Loading Skeleton
            </button>
            <button
              onClick={() => setViewState('empty')}
              className={`px-2.5 py-1 rounded-lg transition ${
                viewState === 'empty' ? 'bg-[#8C8176] text-white' : 'bg-[#EFECE6] text-[#70675D] hover:bg-[#E2DDD5]'
              }`}
            >
              3. Show Empty State
            </button>
            <button
              onClick={simulateApiFetch}
              className="bg-[#6BBF72] text-white px-2.5 py-1 rounded-lg hover:bg-[#5AA860] transition"
            >
              Simulate API Fetch
            </button>
          </div>

          <div className="max-w-6xl mx-auto">
            {/* Header */}
            <div className="mb-6 sm:mb-8">
              <h1 className="text-2xl sm:text-3xl font-normal text-[#4A433B] tracking-tight mb-1">
                อาจารย์ XXXX
              </h1>
              <p className="text-xs sm:text-sm text-[#70675D] font-light">
                คณะ: yyy
              </p>
            </div>

            {/* Table Card */}
            <div className="w-full bg-white rounded-2xl shadow-xs border border-[#E8E4DC] p-5 sm:p-8 min-h-[480px] flex flex-col justify-start">
              {/* Column Headers */}
              <div className="w-full grid grid-cols-12 pb-3 mb-3 border-b border-[#EFECE6] text-xs sm:text-sm text-[#70675D] font-normal select-none">
                <div className="col-span-12 md:col-span-4 pl-3">ชื่อเรื่อง</div>
                <div className="hidden md:block md:col-span-3 text-left">วันที่ได้รับ</div>
                <div className="hidden md:block md:col-span-2 text-left">ผู้รับ</div>
                <div className="hidden md:block md:col-span-2 text-left">ผู้ส่ง</div>
                <div className="col-span-12 md:col-span-1 text-right pr-2"></div>
              </div>

              {/* State 1: Skeleton */}
              {viewState === 'loading' && (
                <div className="space-y-3 w-full">
                  {[1, 2, 3].map((item) => (
                    <div
                      key={item}
                      className="w-full grid grid-cols-12 items-center p-3 sm:p-4 rounded-xl border border-[#EFECE6] bg-[#FAF8F5]/30"
                    >
                      <div className="col-span-12 md:col-span-4 pr-4">
                        <div className="h-4 sm:h-5 bg-[#D5CEC4] rounded-full w-4/5 skeleton-pill"></div>
                      </div>
                      <div className="hidden md:block md:col-span-3 pr-4">
                        <div className="h-4 sm:h-5 bg-[#D5CEC4] rounded-full w-3/4 skeleton-pill"></div>
                      </div>
                      <div className="hidden md:block md:col-span-2 pr-4">
                        <div className="h-4 sm:h-5 bg-[#D5CEC4] rounded-full w-2/3 skeleton-pill"></div>
                      </div>
                      <div className="hidden md:block md:col-span-2 pr-4">
                        <div className="h-4 sm:h-5 bg-[#D5CEC4] rounded-full w-2/3 skeleton-pill"></div>
                      </div>
                      <div className="hidden md:flex md:col-span-1 justify-end gap-2 pr-2">
                        <div className="w-5 h-5 rounded-full bg-[#D5CEC4]/60 skeleton-pill"></div>
                        <div className="w-5 h-5 rounded-full bg-[#D5CEC4]/60 skeleton-pill"></div>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {/* State 2: Empty */}
              {viewState === 'empty' && (
                <div className="w-full flex-1 min-h-[320px] flex items-center justify-center text-center">
                  <p className="text-lg sm:text-xl font-light text-[#9E9689] select-none">
                    ไม่มีเอกสารเข้าสู่ระบบของท่าน
                  </p>
                </div>
              )}

              {/* State 3: Data */}
              {viewState === 'data' && (
                <div className="space-y-2.5 w-full">
                  {sampleDocuments.map((doc) => (
                    <div
                      key={doc.id}
                      className="w-full grid grid-cols-12 items-center p-3 sm:p-4 rounded-xl border border-[#EFECE6] bg-white hover:bg-[#FAF8F5] transition duration-150 group"
                    >
                      <div className="col-span-12 md:col-span-4 pl-3 pr-4">
                        <span
                          onClick={() => handleOpenModal(doc)}
                          className="text-xs sm:text-sm text-[#3D3730] hover:text-[#7A7067] font-normal leading-relaxed break-words cursor-pointer"
                        >
                          {doc.title}
                        </span>
                      </div>

                      <div className="col-span-6 md:col-span-3 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0 pl-3 md:pl-0">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">วันที่: </span>
                        {doc.receivedDate}
                      </div>

                      <div className="col-span-6 md:col-span-2 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">ผู้รับ: </span>
                        {doc.recipient}
                      </div>

                      <div className="col-span-6 md:col-span-2 text-xs sm:text-sm text-[#70675D] font-light mt-2 md:mt-0 pl-3 md:pl-0">
                        <span className="md:hidden text-[#9E9689] block text-[11px]">ผู้ส่ง: </span>
                        {doc.sender}
                      </div>

                      <div className="col-span-6 md:col-span-1 flex items-center justify-end gap-3 pr-2 mt-2 md:mt-0">
                        {/* 👁️ Eye Icon -> Opens Modal */}
                        <button
                          type="button"
                          onClick={() => handleOpenModal(doc)}
                          className="text-[#70675D] hover:text-[#3D3730] hover:bg-[#EFECE6] p-1.5 rounded-lg transition cursor-pointer"
                          title="ดูตัวอย่างเอกสาร (เปิด Modal)"
                          aria-label="ดูตัวอย่างเอกสาร"
                        >
                          <svg
                            className="w-4 h-4 sm:w-5 sm:h-5"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            strokeWidth="1.6"
                          >
                            <path
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                            />
                            <path
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                            />
                          </svg>
                        </button>

                        {/* 📥 Download Icon */}
                        <button
                          type="button"
                          onClick={() => handleDirectDownload(doc)}
                          className="text-[#70675D] hover:text-[#3D3730] hover:bg-[#EFECE6] p-1.5 rounded-lg transition cursor-pointer"
                          title="ดาวน์โหลดเอกสาร"
                          aria-label="ดาวน์โหลดเอกสาร"
                        >
                          <svg
                            className="w-4 h-4 sm:w-5 sm:h-5"
                            fill="none"
                            stroke="currentColor"
                            viewBox="0 0 24 24"
                            strokeWidth="1.6"
                          >
                            <path
                              strokeLinecap="round"
                              strokeLinejoin="round"
                              d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"
                            />
                          </svg>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<LecturerDocumentViewApp />);
  </script>
</body>
</html>
